name: SteamIOS Windows foundation gates

on:
  workflow_dispatch:
  push:
    branches: [steamos-ios]
  pull_request:
    branches: [steamos-ios]

concurrency:
  group: steamos-ios-windows-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify frozen Madeira pins
        run: python3 tools/verify-madeira-pins.py

      - name: Verify shell syntax before expensive builds
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "bash -n $script"
            bash -n "$script"
          done < <(find build tools -type f -name '*.sh' -print0)

      - name: Verify pinned ARM64EC-capable llvm-mingw
        shell: bash
        run: |
          grep -F 'NAME="llvm-mingw-20260922-ucrt-macos-universal"' tools/bootstrap/fetch-llvm-mingw.sh
          grep -F 'EXPECTED="52e5f5a7b131021d0c39a37a38fa380a1da7885cd04bd61afd0cd4ecfb8bc1f3"' tools/bootstrap/fetch-llvm-mingw.sh
          grep -F 'ARM64EC_CXX_RUNTIME_OK' tools/bootstrap/fetch-llvm-mingw.sh
          old='llvm-mingw-2026''0421-ucrt-macos-universal'
          ! grep -R -n -F "$old" build/fex-arm64ec build/fex-wow64 build/wine-pe build/wine-i386 build/steamos-ios .github/workflows/steamos-ios-components.yml .github/workflows/steamos-ios-win32u.yml .github/workflows/steamos-ios-wine-unix.yml

      - name: Reject active Linux Steam personality
        shell: bash
        run: |
          test ! -e runtime/linux
          test ! -e tests/elf
          test ! -e tests/linux-process
          test ! -e tests/linux-syscalls
          ! grep -R -n -E 'steamos_linux_|STEAMOS_IOS_ELF_OK|Run Linux ELF L0' app/Madeira app/Madeira.xcodeproj docs/STEAMOS_IOS_ARCHITECTURE.md

      - name: Verify robust pinned LLVM source fetch
        shell: bash
        run: |
          grep -F 'MAX_ATTEMPTS=5' tools/runtime-deps/fetch-llvm-project.sh
          grep -F 'LLVM_PROJECT_FETCH attempt=' tools/runtime-deps/fetch-llvm-project.sh
          grep -F 'http.version HTTP/1.1' tools/runtime-deps/fetch-llvm-project.sh

      - name: Verify LLVM 23 pinned-FEX compatibility patch
        shell: bash
        run: |
          test -s tools/patches/fex-llvm23-cstdlib.patch
          grep -F '#include <cstdlib>' tools/patches/fex-llvm23-cstdlib.patch
          grep -F 'fex-llvm23-cstdlib.patch' build/fex-arm64ec/build.sh
          grep -F 'fex-llvm23-cstdlib.patch' build/fex-wow64/build.sh

      - name: Verify ARM64EC FEX disables LTO
        shell: bash
        run: |
          grep -F -- '-DENABLE_LTO=OFF' build/fex-arm64ec/build.sh
          grep -F -- '-DENABLE_LTO=OFF' build/fex-wow64/build.sh

      - name: Verify clean IPA host prerequisites
        shell: bash
        run: |
          grep -F 'brew install bison ccache ninja meson sevenzip' .github/workflows/steamos-ios-app.yml
          grep -F 'for tool in cmake ninja meson python3 xcodebuild' build/steamos-ios/build-clean-app.sh
          grep -F 'CLEAN_APP_HOST_TOOLS_OK' build/steamos-ios/build-clean-app.sh

      - name: Verify clean build regenerates WoW64/i386 payload
        shell: bash
        run: |
          grep -F 'bash build/fex-arm64ec/build.sh' build/steamos-ios/build-clean-app.sh
          grep -F -- '-DMINGW_TRIPLE=arm64ec-w64-mingw32' build/fex-arm64ec/build.sh
          grep -F -- '-DFEX_IOS_HOST_BUILD=ON' build/fex-arm64ec/build.sh
          grep -F -- '-DCMAKE_CXX_FLAGS=-DFEX_IOS_HOST' build/fex-arm64ec/build.sh
          grep -F 'bash build/fex-wow64/build.sh' build/steamos-ios/build-clean-app.sh
          grep -F 'bash build/wine-i386/build.sh' build/steamos-ios/build-clean-app.sh
          grep -F 'STEAMOS_IOS_WOW64_PAYLOAD_OK' build/steamos-ios/build-clean-app.sh
          grep -F 'i386 import closure FAILED' build/wine-i386/build.sh

      - name: Verify no native Linux-ELF FEX bridge is linked
        shell: bash
        run: |
          test ! -e app/Madeira/FEXBridge.mm
          test ! -e app/Madeira/FEXBridge.h
          test ! -e app/Madeira/hello_x86.elf
          test ! -e app/Madeira/hello_x86.h
          ! grep -F 'FEXBridge' app/Madeira/Madeira-Bridging-Header.h
          ! grep -F 'FEXBridge' app/Madeira.xcodeproj/project.pbxproj
          ! grep -F 'libFEXCore.a' app/Madeira.xcodeproj/project.pbxproj
          ! grep -F 'build/fex-ios/build.sh' build/steamos-ios/build-clean-app.sh

      - name: Verify FEX + Wine ARM64EC + WoW64 payload
        shell: bash
        run: |
          test "$(git ls-tree HEAD FEX | awk '{print $3}')" = "26859e184ad90f0e811d7f8bbd943a4b1573a2c3"
          test "$(git ls-tree HEAD wine | awk '{print $3}')" = "4f5b19718f4de88ecc5cb0dc08b119497a67ba8f"
          test -s app/Madeira/aarch64-windows/wow64.dll
          test -s app/Madeira/aarch64-windows/wow64win.dll
          test -s app/Madeira/aarch64-windows/xtajit.dll
          test -s app/Madeira/arm64ec-windows/xtajit64.dll

      - name: Verify Hangover convergence contract
        shell: bash
        run: |
          test -s runtime/runtime-lock.json
          test -s runtime/profiles/steam.json
          test -s runtime/profiles/default-game.json
          test -s tools/patches/apply-hangover-wine.py
          grep -F 'HODLL64' tools/patches/apply-hangover-wine.py
          grep -F 'HODLL' tools/patches/apply-hangover-wine.py
          grep -F 'libarm64ecfex.dll' build/fex-arm64ec/build.sh
          grep -F 'libwow64fex.dll' build/fex-wow64/build.sh
          grep -F 'setenv("HODLL64", "libarm64ecfex.dll", 1)' app/Madeira/WineProcessBridge.m
          grep -F 'setenv("HODLL", "libwow64fex.dll", 1)' app/Madeira/WineProcessBridge.m
          grep -F 'python3 tools/patches/apply-hangover-wine.py "$PWD/wine"' .github/workflows/steamos-ios-app.yml
          grep -F 'STEAMOS_HANGOVER_WINE_SOURCE_READY' .github/workflows/steamos-ios-app.yml
          grep -F 'steamios-i386-farm-xcode27-v2-' .github/workflows/steamos-ios-app.yml
          grep -F 'steamios-runtime-xcode27-v5-' .github/workflows/steamos-ios-app.yml
          python3 tools/verify-hangover-port.py
          python3 build/host-tests/check-gamepad.py
          test -s runtime/runtime-pack.json
          grep -F 'startWirelessControllerDiscovery' app/Madeira/GamepadInput.swift
          grep -F 'SteamIOSControllerHaptics' app/Madeira/GamepadInput.swift
          grep -F 'NtUserGamepadOp_Vibration' tools/patches/apply-hangover-wine.py
          grep -F 'NtUserGamepadOp_Battery' tools/patches/apply-hangover-wine.py
          grep -F 'XInputGetBatteryInformation' docs/CONTROLLERS.md
          grep -F '[boot-budget]' app/Madeira/ContentView.swift

      - name: Verify normal Steam launch has no research probes
        shell: bash
        run: |
          grep -F 'private func configureSteamProductRuntime' app/Madeira/ContentView.swift
          grep -F '"MADEIRA_IRCAP_RVA", "MADEIRA_IRCAP_MODULE"' app/Madeira/ContentView.swift
          grep -F '"MADEIRA_DUMP_SURFACES", "MADEIRA_SURF_SEQ"' app/Madeira/ContentView.swift
          grep -F '"MADEIRA_DEAD_RELEASE", "MADEIRA_SRCWATCH", "MADEIRA_SRCWATCH_ROWS"' app/Madeira/ContentView.swift
          grep -F 'setenv("MADEIRA_JITLESS", "1", 1)' app/Madeira/ContentView.swift
          grep -F 'setenv("MADEIRA_INPROC_SYNC", "0", 1)' app/Madeira/ContentView.swift
          grep -F 'MADEIRA_INPROC_SYNC' build/madsync/madsync.c
          ! grep -F 'setenv("MADEIRA_SURF_SEQ"' app/Madeira/ContentView.swift
          ! grep -F 'setenv("MADEIRA_IRCAP_RVA"' app/Madeira/ContentView.swift

      - name: Verify windowless Steam bootstrap
        shell: bash
        run: |
          test -s build/steamios-launcher/steamios-launcher.c
          test -s build/steamios-launcher/build.sh
          grep -F 'bash build/steamios-launcher/build.sh' build/steamos-ios/build-clean-app.sh
          grep -F 'bash build/steamios-launcher/build.sh' .github/workflows/steamos-ios-app.yml
          grep -F 'STEAMOS_IOS_SUBMODULE_RETRY_OK' .github/workflows/steamos-ios-app.yml
          grep -F 'setenv("MADEIRA_EXE", "steamios-launcher.exe", 1)' app/Madeira/ContentView.swift
          grep -F 'CreateProcessW' build/steamios-launcher/steamios-launcher.c
          grep -F 'services.exe' build/steamios-launcher/steamios-launcher.c
          grep -F -- '-gamepadui' build/steamios-launcher/steamios-launcher.c
          grep -F '.steamios-steam-launched' build/steamios-launcher/steamios-launcher.c
          ! grep -F -- ' -console' build/steamios-launcher/steamios-launcher.c
          ! grep -F 'private var steamLaunchSurface' app/Madeira/ContentView.swift
          ! grep -F 'Text("Starting Big Picture")' app/Madeira/ContentView.swift
          ! grep -F 'SteamLaunchPalette' app/Madeira/ContentView.swift
          grep -F 'winios_set_product_visible(1)' app/Madeira/ContentView.swift
          grep -F 'clonefile(bundleSteam.fileSystemRepresentation' app/Madeira/WineProcessBridge.m
          grep -F '__wine_SvcctlStarted' build/steamios-launcher/steamios-launcher.c
          grep -F 'wait_for_services_ready' build/steamios-launcher/steamios-launcher.c
          grep -F 'Wine Service Control Manager did not become ready' build/steamios-launcher/steamios-launcher.c
          grep -F 'Real-Steam-only startup' app/Madeira/ContentView.swift
          ! grep -F 'steam-launch.bat' app/Madeira/ContentView.swift
          grep -F 'winios_set_product_visible(0)' app/Madeira/ContentView.swift
          grep -F 'winios_set_product_visible(steamSettingsPresented ? 0 : 1)' app/Madeira/ContentView.swift
          grep -F '[x18-xzr-recover] ml1137' build/ntdll-unix/signal_arm64_ios.c
          grep -F 'ml1138: MOV XZR, X18 is a semantic no-op' build/ntdll-unix/virtual_ios.c
          grep -F 'if (rd == 31)' build/ntdll-unix/virtual_ios.c
          test -s tools/patches/apply-fex-invalidation-lock.py
          test -s tools/patches/apply-fex-interval-mutex.py
          grep -F 'apply-fex-invalidation-lock.py' build/fex-arm64ec/build.sh
          grep -F 'apply-fex-invalidation-lock.py' build/fex-wow64/build.sh
          grep -F 'apply-fex-interval-mutex.py' build/fex-arm64ec/build.sh
          grep -F 'apply-fex-interval-mutex.py' build/fex-wow64/build.sh
          grep -F 'FEX_IOS_INTERVAL_LOCK_PATCH_REFUSED' tools/patches/apply-fex-invalidation-lock.py
          grep -F 'FEX_IOS_INTERVAL_MUTEX_PATCH_REFUSED' tools/patches/apply-fex-interval-mutex.py
          grep -F 'ml1140: NEVER call NtProtectVirtualMemory while holding' tools/patches/apply-fex-invalidation-lock.py
          grep -F 'iOS-Madeira ml1141: re-entrant-safe interval RW lock' tools/patches/apply-fex-interval-mutex.py
          grep -F 'iOS-Madeira ml1142: token-scoped recursive interval writer' tools/patches/apply-fex-interval-mutex.py
          grep -F 'ios_lock_write_nested_aware' tools/patches/apply-fex-interval-mutex.py
          grep -F 'WritePriorityMutex::Mutex IntervalsLock' tools/patches/apply-fex-interval-mutex.py
          grep -F '[iOS-xlock] ml1140' tools/patches/apply-fex-invalidation-lock.py
          grep -F '.steamios-runtime-ready-v2' app/Madeira/WineProcessBridge.m
          grep -F '[prefix-fast] ml1141 READY' app/Madeira/WineProcessBridge.m
          grep -F '[prefix-clone] ml1143' app/Madeira/WineProcessBridge.m
          grep -F 'copyItemAtPath:bundleSteam toPath:steamDir' app/Madeira/WineProcessBridge.m
          grep -F 'STEAMIOS_EXPANDED_STEAM_STAGE_OK' build/steamos-ios/build-clean-app.sh
          grep -F 'STEAMIOS_PACKAGED_EXPANDED_STEAM_OK' build/steamos-ios/build-clean-app.sh
          grep -F 'STEAMIOS_PACKAGED_FAST_PREFIX_OK' build/steamos-ios/build-clean-app.sh
          ! grep -F 'STEAMIOS_PREFIX_FULL_STEAM_OK' build/steamos-ios/build-clean-app.sh

      - name: Verify preinstalled Steam shipping path
        shell: bash
        run: |
          grep -F 'SteamPayload.tar.gz' build/steamos-ios/build-clean-app.sh
          grep -F 'assemble preinstalled Windows Steam client' .github/workflows/steamos-ios-app.yml
          grep -F '.steamios-bundled-client' app/Madeira/ContentView.swift
          grep -F 'madeira_extract_prefix_subtree_tgz' app/Madeira/WineProcessBridge.m
          grep -F '.steamios-steam-launched' app/Madeira/ContentView.swift
          grep -F 'steamProcessObserved' app/Madeira/ContentView.swift
          grep -F 'Steam process launched; waiting for verified Steam pixels.' app/Madeira/ContentView.swift
          grep -F 'steamLandscapeRequested = true' app/Madeira/ContentView.swift
          grep -F 'g_wineserver_should_stop = 0;' app/Madeira/WineServerBridge.m
          grep -F 'winios_window_identity' build/win32u-unix/driver_ios.c
          grep -F 'winios_is_steam_window(hwnd)' app/Madeira/Winios/Winios.m
          grep -F 'setenv("MADEIRA_EXE", "steamios-launcher.exe", 1)' app/Madeira/ContentView.swift
          grep -F -- '-gamepadui' build/steamios-launcher/steamios-launcher.c
          ! grep -F 'steam-launch.bat' app/Madeira/ContentView.swift
          grep -F 'MADEIRA_JITLESS' app/Madeira/ContentView.swift
          ! grep -F 'SteamSetup.exe /S' app/Madeira/ContentView.swift
          ! grep -F 'Installing Steam' app/Madeira/ContentView.swift

      - name: Verify first-run Wine prefix seed
        shell: bash
        run: |
          grep -F 'madeira_seed_prefix_if_needed' app/Madeira/WineProcessBridge.h
          grep -F 'madeira_seed_prefix_if_needed' app/Madeira/ContentView.swift

      - name: Verify adaptive iPhone/iPad display
        shell: bash
        run: |
          grep -F 'private enum SteamOSDisplayProfile' app/Madeira/ContentView.swift
          grep -F 'let height = isPad ? 900 : 720' app/Madeira/ContentView.swift
          grep -F 'window.safeAreaInsets' app/Madeira/ContentView.swift
          grep -F 'SteamOSDisplayProfile.activeGuestSize()' app/Madeira/ContentView.swift
          grep -F 'let presentation = convert(gameRect(), to: w)' app/Madeira/ContentView.swift
          grep -F 'void winios_set_product_visible(int visible);' app/Madeira/Winios/Winios.h
          test -s docs/STEAMOS_IOS_DISPLAY.md

      - name: Verify mandatory JIT + local Apple GPU
        shell: bash
        run: |
          grep -F 'private enum SteamOSRuntimeGate' app/Madeira/ContentView.swift
          grep -F 'jit_check_debugged()' app/Madeira/ContentView.swift
          grep -F 'let probe = jit_test_execute_strategy2()' app/Madeira/ContentView.swift
          grep -F 'guard probe == 42' app/Madeira/ContentView.swift
          grep -F 'MTLCreateSystemDefaultDevice()' app/Madeira/ContentView.swift
          grep -F 'STEAMOS_IOS_LOCAL_METAL' app/Madeira/ContentView.swift
          grep -F 'JIT pool setup FAILED — not starting Wine.' app/Madeira/ContentView.swift
          grep -F 'func allocateDebuggerRXFromReservation' app/Madeira/StikJITHelper.swift
          grep -F 'func validateRXRange' app/Madeira/StikJITHelper.swift
          grep -F 'pre-remap RX validation' app/Madeira/StikJITHelper.swift
          grep -F 'post-alias RX validation' app/Madeira/StikJITHelper.swift
          grep -F 'startup-reservation' app/Madeira/StikJITHelper.swift
          grep -F 'components.scheme = "stikdebug"' app/Madeira/StikJITHelper.swift
          grep -F 'URLQueryItem(name: "bundle-id"' app/Madeira/StikJITHelper.swift
          grep -F 'URLQueryItem(name: "pid"' app/Madeira/StikJITHelper.swift
          grep -F 'URLQueryItem(name: "script-data"' app/Madeira/StikJITHelper.swift
          grep -F 'private static var resolvedScriptBase64: String?' app/Madeira/StikJITHelper.swift
          ! grep -F 'private static let scriptBase64' app/Madeira/StikJITHelper.swift
          grep -F 'checkAppEntitlement("get-task-allow")' app/Madeira/StikJITHelper.swift
          grep -F 'jit_check_debugged() && isDebuggerAttached()' app/Madeira/StikJITHelper.swift
          grep -F '__attribute__((noinline, optnone, naked))' app/Madeira/JITAllocator.c
          grep -F '<string>stikdebug</string>' app/Madeira/Info.plist
          ! grep -F 'stikjit://enable-jit' app/Madeira/StikJITHelper.swift
          ! grep -F 'func prepareExactPool' app/Madeira/StikJITHelper.swift
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER = com.nightvibes33.steamios;' app/Madeira.xcodeproj/project.pbxproj
          grep -F 'Assets.xcassets in Resources' app/Madeira.xcodeproj/project.pbxproj
          grep -F 'madeira-jit.js in Resources' app/Madeira.xcodeproj/project.pbxproj
          ! grep -E '^[[:space:]]*setenv\("DXMT_REMOTE_METAL"' app/Madeira/ContentView.swift
          ! grep -E '^[[:space:]]*setenv\("RMETAL_TOKEN"' app/Madeira/ContentView.swift

      - name: Verify Windows FEX uses the real Steam/game JIT pool
        shell: bash
        run: |
          grep -F 'setenv("WINE_IOS_JIT_RX"' app/Madeira/ContentView.swift
          grep -F 'setenv("WINE_IOS_JIT_RW"' app/Madeira/ContentView.swift
          grep -F 'setenv("WINE_IOS_JIT_SIZE"' app/Madeira/ContentView.swift
          grep -F 'WINE_IOS_JIT_RW - WINE_IOS_JIT_RX' app/Madeira/WineProcessBridge.m
          ! grep -F 'fex_get_jit_write_offset' app/Madeira/WineProcessBridge.m
          ! grep -F 'MADEIRA_JIT_WRITE_OFFSET' app/Madeira/WineProcessBridge.m

      - name: Verify Steam child identity is not hard-coded
        shell: bash
        run: |
          grep -F 'MADEIRA_STEAM_APP_PATH' app/Madeira/WineProcessBridge.m
          grep -F 'MADEIRA_STEAM_APP_ID' app/Madeira/WineProcessBridge.m
          ! grep -E 'setenv\("Steam(AppId|GameId)"[^;]*356400' app/Madeira/WineProcessBridge.m
          grep -F 'setenv("MADEIRA_STEAM_APP_ID", "356400", 1)' app/Madeira/ContentView.swift

      - name: Verify mobile-first Steam shell
        shell: bash
        run: |
          grep -F 'private func startSteamAutomatically()' app/Madeira/ContentView.swift
          grep -F 'private func launchSteamProductRuntime()' app/Madeira/ContentView.swift
          grep -F 'private var steamProductBody: some View' app/Madeira/ContentView.swift
          grep -F 'if case .failed(let message) = productState' app/Madeira/ContentView.swift
          ! grep -F 'return "Starting Steam"' app/Madeira/ContentView.swift
          ! grep -F 'return "Launching Steam"' app/Madeira/ContentView.swift
          grep -F 'StikJITHelper.enableJIT' app/Madeira/ContentView.swift
          grep -F '@Published var touchScreenEnabled = true' app/Madeira/ContentView.swift
          grep -F '@Published var directTouch = true' app/Madeira/ContentView.swift
          grep -F '@Published var controllerOverlayEnabled = false' app/Madeira/ContentView.swift
          grep -F 'private static func defaultLayout()' app/Madeira/ContentView.swift
          grep -F 'active.count >= 3' app/Madeira/ContentView.swift
          grep -F 'NotificationCenter.default.post(name: .steamOSSettingsRequested' app/Madeira/ContentView.swift
          grep -F 'STEAMOS_IOS_TOUCHSCREEN' app/Madeira/ContentView.swift
          grep -F 'struct SteamIOSApp: App' app/Madeira/MadeiraApp.swift

      - name: Verify D3D11 Metal path
        shell: bash
        run: |
          test -s app/Madeira/arm64ec-windows/d3d11.dll
          test -s app/Madeira/arm64ec-windows/dxgi.dll
          test -s app/Madeira/arm64ec-windows/d3d10core.dll
          test -s app/Madeira/arm64ec-windows/winemetal.dll

      - name: Verify D3D12 capability canary remains packaged
        shell: bash
        run: |
          test -s app/Madeira/arm64ec-windows/d3d12.dll
          test -s app/Madeira/arm64ec-windows/d3d12-cube-x64.exe

      - name: Verify Steam Settings touch/controller policy
        shell: bash
        run: |
          grep -F 'struct SteamSettingsView: View' app/Madeira/ContentView.swift
          grep -F 'Full-screen Touch' app/Madeira/ContentView.swift
          grep -F 'Show Controller Overlay' app/Madeira/ContentView.swift
          grep -F '@Published var directTouch = true' app/Madeira/ContentView.swift
          grep -F '@Published var controllerOverlayEnabled = false' app/Madeira/ContentView.swift
          grep -F 'InputSettings.shared.controllerOverlayEnabled' app/Madeira/ContentView.swift
          grep -F 'Notification.Name("SteamIOS.SettingsRequested")' app/Madeira/ContentView.swift

      - name: Verify native iOS host plumbing
        shell: bash
        run: |
          grep -F 'CAMetalLayer' app/Madeira/ContentView.swift
          grep -F 'GamepadInput.swift' app/Madeira.xcodeproj/project.pbxproj
          grep -F 'TouchGamepad.swift' app/Madeira.xcodeproj/project.pbxproj
          grep -F 'JITAllocator.c' app/Madeira.xcodeproj/project.pbxproj

      - name: Verify Settings-owned controller overlay
        shell: bash
        run: |
          grep -F 'TouchControlsHost.setHidden(shown)' app/Madeira/ContentView.swift
          grep -F 'Button("Reset Layout")' app/Madeira/ContentView.swift
          grep -F 'func ensureDefaultLayout()' app/Madeira/ContentView.swift
          grep -F '.pad("L3")' app/Madeira/ContentView.swift
          grep -F '.pad("R3")' app/Madeira/ContentView.swift
          grep -F 'Normal gameplay has NO overlay' app/Madeira/ContentView.swift
          grep -F 'active.count >= 3' app/Madeira/ContentView.swift
          test -s docs/MOBILE_READINESS.md

      - name: Verify stock L3/R3, editor semantics, and login keyboard
        shell: bash
        run: |
          grep -F 'Button("Show On-Screen Keyboard")' app/Madeira/ContentView.swift
          grep -F 'MetalBackedView.toggleKeyboard()' app/Madeira/ContentView.swift
          python3 - <<'PY'
          from pathlib import Path
          s = Path("app/Madeira/ContentView.swift").read_text()
          default = s.split("private static func defaultLayout()", 1)[1].split("private static func migrateLayout", 1)[0]
          assert default.count('.pad("L3")') == 1, "stock layout must contain exactly one L3"
          assert default.count('.pad("R3")') == 1, "stock layout must contain exactly one R3"
          assert "currentLayoutVersion = 2" in s
          assert 'normalizeThumbClick("L3"' in s
          assert 'normalizeThumbClick("R3"' in s
          assert "Transient edit mode is independent" in s
          assert "Reset only geometry/mappings" in s
          assert "guard bounds.width > bounds.height else { return nil }" in s
          assert "if m.editing { topBar }" in s
          PY

      - name: Verify complete mobile shipping contract
        shell: bash
        run: python3 tools/verify-mobile-product.py

      - name: Foundation discriminator
        run: echo STEAMOS_IOS_WINDOWS_FOUNDATION_OK

name: SteamIOS clean upstream IPA

on:
  workflow_dispatch:
  push:
    branches: [steamios-upstream-clean]

permissions:
  contents: read

concurrency:
  group: steamios-upstream-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: clean upstream Madeira -> SteamIOS IPA
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      LLVM_PIN: 8dfdcc7b7bf66834a761bd8de445840ef68e4d1a
      UPSTREAM_BASE: bbbf8d0e20fd8b75f433f4a8d2a8eaf8d5571120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build prerequisites
        run: brew install bison ccache ninja meson sevenzip cmake pkg-config

      - name: Verify Xcode 27 and Metal tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk" == 27.* ]]
          xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
          echo "STEAMIOS_XCODE_READY sdk=$sdk"

      - name: Restore upstream toolchain/source cache
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains
            research/freetype
            app/Madeira/x86_64-vcruntime
          key: steamios-clean-sources-v1-${{ hashFiles('.gitmodules', 'docs/BUILDING.md') }}
          restore-keys: |
            steamios-main-sources-v2-

      - name: Restore LLVM iOS cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: steamios-clean-llvm-v1-${{ env.LLVM_PIN }}
          restore-keys: |
            steamios-main-native-runtime-v1-

      - name: Materialize pinned upstream submodules
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              [ "$n" -lt 4 ] || return 1
              sleep $((n*5))
            done
          }
          for s in FEX wine dxmt madeira-dock; do
            retry git -c http.version=HTTP/1.1 submodule update --init --recursive --depth 1 "$s"
          done
          test "$(git config -f .gitmodules submodule.FEX.url)" = "https://github.com/willfaust/FEX.git"
          test "$(git config -f .gitmodules submodule.wine.url)" = "https://github.com/willfaust/wine.git"
          test "$(git config -f .gitmodules submodule.dxmt.url)" = "https://github.com/willfaust/dxmt.git"
          test "$(git config -f .gitmodules submodule.madeira-dock.url)" = "https://github.com/willfaust/madeira-dock.git"
          echo "STEAMIOS_UPSTREAM_SUBMODULES_READY"

      - name: Verify untouched upstream runtime payload
        shell: bash
        run: |
          set -euo pipefail
          # These are upstream's shipped/prebuilt runtime assets. SteamIOS must
          # consume them exactly as upstream committed them instead of rebuilding
          # its own ARM64EC/aarch64 Windows farms.
          git diff --exit-code "$UPSTREAM_BASE" -- \
            app/Madeira/aarch64-windows \
            app/Madeira/arm64ec-windows \
            app/Madeira/d3d12/libmetalirconverter.dylib \
            app/Madeira/libgmp.a \
            app/Madeira/libnettle.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libgnutls.a
          test -s app/Madeira/arm64ec-windows/xtajit64.dll
          test -s app/Madeira/aarch64-windows/xtajit.dll
          test -s app/Madeira/arm64ec-windows/ntdll.dll
          test -s app/Madeira/arm64ec-windows/dxgi.dll
          test -s app/Madeira/arm64ec-windows/d3d11.dll
          test -s app/Madeira/d3d12/libmetalirconverter.dylib
          echo "STEAMIOS_UPSTREAM_TRACKED_RUNTIME_OK"

      - name: Bootstrap pinned external dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchains research

          NAME="llvm-mingw-20260421-ucrt-macos-universal"
          DEST="$PWD/toolchains/$NAME"
          ARCHIVE="$PWD/toolchains/$NAME.tar.xz"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/$NAME.tar.xz"
          EXPECTED="bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7"
          if [[ ! -x "$DEST/bin/aarch64-w64-mingw32-clang" ]]; then
            curl -fL --retry 4 --retry-delay 2 "$URL" -o "$ARCHIVE"
            ACTUAL="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')"
            [[ "$ACTUAL" == "$EXPECTED" ]]
            rm -rf "$DEST"
            tar -xJf "$ARCHIVE" -C toolchains
          fi
          test -x "$DEST/bin/aarch64-w64-mingw32-clang"
          test -x "$DEST/bin/arm64ec-w64-mingw32-clang++"
          test -x "$DEST/bin/i686-w64-mingw32-clang"

          if [[ ! -d research/freetype/.git ]] || [[ "$(git -C research/freetype rev-parse HEAD 2>/dev/null || true)" != "42608f77f20749dd6ddc9e0536788eaad70ea4b5" ]]; then
            rm -rf research/freetype
            git init -q research/freetype
            git -C research/freetype remote add origin https://github.com/freetype/freetype.git
            git -C research/freetype -c http.version=HTTP/1.1 fetch --depth 1 origin 42608f77f20749dd6ddc9e0536788eaad70ea4b5
            git -C research/freetype checkout -q --detach 42608f77f20749dd6ddc9e0536788eaad70ea4b5
          fi

          if [[ ! -d toolchains/llvm-project/.git ]] || [[ "$(git -C toolchains/llvm-project rev-parse HEAD 2>/dev/null || true)" != "$LLVM_PIN" ]]; then
            rm -rf toolchains/llvm-project
            git init -q toolchains/llvm-project
            git -C toolchains/llvm-project remote add origin https://github.com/llvm/llvm-project.git
            git -C toolchains/llvm-project -c http.version=HTTP/1.1 fetch --no-tags --depth 1 origin "$LLVM_PIN"
            git -C toolchains/llvm-project checkout -q --detach "$LLVM_PIN"
          fi

          if [[ ! -d app/Madeira/x86_64-vcruntime ]] || [[ -z "$(find app/Madeira/x86_64-vcruntime -maxdepth 1 -name '*.dll' -print -quit 2>/dev/null)" ]]; then
            echo "x86_64-vcruntime cache miss; materializing pinned Microsoft runtime"
            TMP="$(mktemp -d)"
            git -c http.version=HTTP/1.1 fetch --no-tags --depth 1 origin steamios-main-bigpicture
            git show FETCH_HEAD:tools/runtime-deps/fetch-vcruntime.sh > "$TMP/fetch-vcruntime.sh"
            test -s "$TMP/fetch-vcruntime.sh"
            mkdir -p tools/runtime-deps
            cp "$TMP/fetch-vcruntime.sh" tools/runtime-deps/.ci-fetch-vcruntime.sh
            bash tools/runtime-deps/.ci-fetch-vcruntime.sh
            rm -f tools/runtime-deps/.ci-fetch-vcruntime.sh
            rm -rf "$TMP"
          fi
          echo "STEAMIOS_EXTERNAL_DEPS_READY"

      - name: Save upstream toolchain/source cache
        if: steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
            toolchains/llvm-project
            research/freetype
            app/Madeira/x86_64-vcruntime
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check="$CCACHE_COMPILERCHECK"
          ccache --set-config=base_dir="$CCACHE_BASEDIR"
          ccache --set-config=hash_dir=false
          ccache --zero-stats

      - name: Ensure LLVM iOS archives
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s toolchains/llvm-ios-build/lib/libLLVMSupport.a ]]; then
            SRC="$PWD/toolchains/llvm-project/llvm"
            HOST="$PWD/toolchains/llvm-host-build"
            IOS="$PWD/toolchains/llvm-ios-build"
            SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            JOBS="$(sysctl -n hw.ncpu)"
            if [[ ! -x "$HOST/bin/llvm-tblgen" ]]; then
              cmake -S "$SRC" -B "$HOST" -G Ninja                 -DCMAKE_BUILD_TYPE=Release                 -DLLVM_TARGETS_TO_BUILD=Native                 -DLLVM_ENABLE_PROJECTS=                 -DLLVM_BUILD_TOOLS=ON                 -DLLVM_INCLUDE_TESTS=OFF                 -DLLVM_INCLUDE_BENCHMARKS=OFF                 -DLLVM_INCLUDE_EXAMPLES=OFF                 -DLLVM_ENABLE_BINDINGS=OFF                 -DLLVM_ENABLE_ZLIB=OFF                 -DLLVM_ENABLE_ZSTD=OFF                 -DLLVM_ENABLE_TERMINFO=OFF                 -DLLVM_ENABLE_LIBXML2=OFF
              cmake --build "$HOST" --target llvm-tblgen -j "$JOBS"
            fi
            if [[ ! -f "$IOS/CMakeCache.txt" ]]; then
              cmake -S "$SRC" -B "$IOS" -G Ninja                 -DCMAKE_SYSTEM_NAME=iOS                 -DCMAKE_OSX_ARCHITECTURES=arm64                 -DCMAKE_OSX_SYSROOT="$SDK"                 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0                 -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY                 -DLLVM_TABLEGEN="$HOST/bin/llvm-tblgen"                 -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0                 -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0                 -DLLVM_TARGET_ARCH=host                 -DLLVM_TARGETS_TO_BUILD=                 -DLLVM_ENABLE_PROJECTS=                 -DLLVM_BUILD_TOOLS=OFF                 -DLLVM_INCLUDE_TOOLS=OFF                 -DLLVM_BUILD_UTILS=OFF                 -DLLVM_INCLUDE_UTILS=OFF                 -DLLVM_INCLUDE_TESTS=OFF                 -DLLVM_INCLUDE_BENCHMARKS=OFF                 -DLLVM_INCLUDE_EXAMPLES=OFF                 -DLLVM_ENABLE_BINDINGS=OFF                 -DLLVM_ENABLE_ZLIB=OFF                 -DLLVM_ENABLE_ZSTD=OFF                 -DLLVM_ENABLE_TERMINFO=OFF                 -DLLVM_ENABLE_LIBXML2=OFF                 -DLLVM_BUILD_LLVM_DYLIB=OFF                 -DLLVM_LINK_LLVM_DYLIB=OFF
            fi
            cmake --build "$IOS" --target               LLVMPasses LLVMTarget LLVMObjCARCOpts LLVMCoroutines LLVMipo LLVMInstrumentation LLVMVectorize               LLVMLinker LLVMIRReader LLVMAsmParser LLVMFrontendOpenMP LLVMScalarOpts LLVMInstCombine               LLVMAggressiveInstCombine LLVMTransformUtils LLVMBitWriter LLVMAnalysis LLVMProfileData               LLVMSymbolize LLVMDebugInfoPDB LLVMDebugInfoMSF LLVMDebugInfoDWARF LLVMObject LLVMTextAPI               LLVMMCParser LLVMMC LLVMDebugInfoCodeView LLVMBitReader LLVMCore LLVMRemarks LLVMBitstreamReader               LLVMBinaryFormat LLVMSupport LLVMDemangle -j "$JOBS"
          fi
          test -s toolchains/llvm-ios-build/lib/libLLVMSupport.a
          echo "STEAMIOS_LLVM_IOS_READY"

      - name: Save LLVM iOS cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: steamios-clean-llvm-v1-${{ env.LLVM_PIN }}

      - name: Configure current Wine build trees
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/bison/bin:$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          rm -rf wine/build-macos wine/build-arm64ec wine/build-i386
          mkdir -p wine/build-macos
          (
            cd wine/build-macos
            ../configure --without-x --disable-tests --enable-winegstreamer
          )
          mkdir -p wine/build-arm64ec
          (
            cd wine/build-arm64ec
            ../configure --enable-archs=arm64ec --without-x --disable-tests --enable-winegstreamer
          )
          echo "STEAMIOS_WINE_CONFIGURED"

      - name: Build only upstream-untracked native dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/bison/bin:$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          # Upstream tracks the four final GnuTLS-family archives. Run its
          # build only to materialize the generated headers needed by Wine, then
          # restore the exact upstream archives before linking.
          bash build/gnutls-ios/build.sh
          git checkout "$UPSTREAM_BASE" -- \
            app/Madeira/libgmp.a app/Madeira/libnettle.a \
            app/Madeira/libhogweed.a app/Madeira/libgnutls.a
          bash build/freetype-ios/build.sh
          bash build/ffmpeg/build.sh
          python3 tools/patches/apply-fex-ios-apple-runtime.py FEX
          rm -rf FEX/build-ios
          cmake -S FEX -B FEX/build-ios             -DCMAKE_SYSTEM_NAME=iOS             -DCMAKE_SYSTEM_PROCESSOR=arm64             -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_SYSROOT=iphoneos             -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0             -DCMAKE_BUILD_TYPE=Release             -DBUILD_TESTING=OFF             -DBUILD_THUNKS=OFF             -DBUILD_FEXCONFIG=OFF             -DBUILD_FEX_LINUX_TESTS=OFF             -DENABLE_FEX_ALLOCATOR=OFF             -DENABLE_ASSERTIONS=OFF             -DENABLE_CLANG_THUNKS=ON             -DENABLE_CCACHE=ON             -DTUNE_CPU=none
          bash build/fex-ios/build.sh
          bash build/wineserver/build.sh all
          bash build/ntdll-unix/build.sh
          bash build/win32u-unix/build.sh
          bash build/dxmt-ios/build.sh
          rustup target add aarch64-apple-ios
          bash build/rppairing-ios/build.sh
          bash build/madeira-dock/build.sh
          echo "STEAMIOS_NATIVE_RUNTIME_BUILT"

      - name: Build i386 Wine/DXMT farm
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/bison/bin:$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          bash build/wine-i386/build.sh
          echo "STEAMIOS_I386_READY"

      - name: Verify runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s FEX/build-ios/FEXCore/Source/libFEXCore.a
          test -s FEX/build-ios/FEXCore/Source/libFEXCore_Base.a
          test -s FEX/build-ios/FEXCore/Source/libJemallocLibs.a
          test -s app/Madeira/libwineserver.a
          test -s app/Madeira/libntdll_unix.a
          test -s app/Madeira/libwin32u_unix.a
          test -s app/Madeira/libdxmt_combined.a
          test -s app/Madeira/libmadeira_rppairing.a
          test -s app/Madeira/libavformat.a
          test -s app/Madeira/arm64ec-windows/dockhost.exe
          test -s app/Madeira/arm64ec-windows/xtajit64.dll
          test -s app/Madeira/aarch64-windows/xtajit.dll
          test -s app/Madeira/i386-windows/kernel32.dll
          test -s app/Madeira/i386-windows/d3d11.dll
          echo "STEAMIOS_RUNTIME_INPUTS_READY"

      - name: Refresh bundled licenses
        shell: bash
        run: |
          set -euo pipefail
          bash build/stage-licenses.sh

      - name: Build unsigned Debug iPhoneOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/steamios-clean-derived
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/steamios-clean-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/steamios-clean-xcodebuild.log

      - name: Ad-hoc sign SteamIOS with sideload entitlements
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/steamios-clean-derived/Build/Products/Debug-iphoneos -maxdepth 1 -type d -name 'SteamIOS.app' -print -quit)"
          test -n "$APP"
          test -s app/Madeira/Madeira.entitlements

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' item; do
              /usr/bin/codesign --force --sign - --timestamp=none "$item"
            done
            find "$APP/Frameworks" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' item; do
              /usr/bin/codesign --force --sign - --timestamp=none "$item"
            done
          fi

          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -type d -name '*.appex' -print0 | while IFS= read -r -d '' item; do
              /usr/bin/codesign --force --sign - --timestamp=none "$item"
            done
          fi

          /usr/bin/codesign --force --sign - --timestamp=none \
            --entitlements app/Madeira/Madeira.entitlements "$APP"

          /usr/bin/codesign -d --entitlements :- "$APP" > /tmp/steamios-entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' /tmp/steamios-entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' /tmp/steamios-entitlements.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :get-task-allow' /tmp/steamios-entitlements.plist | grep -qx true
          echo "STEAMIOS_ADHOC_ENTITLEMENTS_OK"

      - name: Package and audit IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/steamios-clean-derived/Build/Products/Debug-iphoneos -maxdepth 1 -type d -name 'SteamIOS.app' -print -quit)"
          test -n "$APP"
          test -s "$APP/SteamIOS"
          test -s "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx 'com.nightvibes33.steamios'
          if find "$APP" -type f -iname 'steam.exe' -print -quit | grep -q .; then
            echo "error: Steam client leaked into the IPA" >&2
            exit 1
          fi

          rm -rf artifacts
          mkdir -p artifacts/Payload
          /usr/bin/ditto "$APP" artifacts/Payload/SteamIOS.app
          (
            cd artifacts
            /usr/bin/zip -qry -9 SteamIOS.ipa Payload
            rm -rf Payload
          )

          shasum -a 256 artifacts/SteamIOS.ipa > artifacts/SteamIOS.ipa.sha256
          app_bytes="$(du -sk "$APP" | awk '{print $1 * 1024}')"
          ipa_bytes="$(stat -f%z artifacts/SteamIOS.ipa)"
          printf 'app_bytes=%s\nipa_bytes=%s\n' "$app_bytes" "$ipa_bytes" | tee artifacts/size.txt
          unzip -tq artifacts/SteamIOS.ipa
          unzip -Z1 artifacts/SteamIOS.ipa | grep -q '^Payload/SteamIOS\.app/Info\.plist$'

          /usr/bin/codesign -d --entitlements :- "$APP" > artifacts/SteamIOS.entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' artifacts/SteamIOS.entitlements.plist | grep -qx true
          echo "STEAMIOS_IPA_OK app_bytes=$app_bytes ipa_bytes=$ipa_bytes memory_plus=embedded"

      - name: Cache statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true

      - name: Upload sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SteamIOS-upstream-clean-sideload
          path: |
            artifacts/SteamIOS.ipa
            artifacts/SteamIOS.ipa.sha256
            artifacts/SteamIOS.entitlements.plist
            artifacts/size.txt
            build/steamios-clean-xcodebuild.log
          if-no-files-found: error
          compression-level: 0

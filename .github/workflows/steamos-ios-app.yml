name: SteamIOS clean app + IPA

on:
  push:
    branches: [steamios-fex-lock-diagnosis]
    paths:
      - ".github/workflows/steamos-ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steamos-ios-clean-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnosis-hold:
    runs-on: ubuntu-latest
    steps:
      - run: echo "STEAMIOS_DIAGNOSIS_APP_BUILD_SUPPRESSED"

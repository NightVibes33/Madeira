name: SteamIOS clean app + IPA

on:
  workflow_dispatch:
  push:
    branches: [steamos-ios]
    paths:
      - ".github/workflows/steamos-ios-app.yml"
      - "build/steamos-ios/TRIGGER_APP_BUILD"

permissions:
  contents: read

concurrency:
  group: steamos-ios-clean-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-app:
    name: clean Debug iPhoneOS app and IPA
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned source/toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-mingw-20260922-ucrt-macos-universal
            toolchains/llvm-mingw-20260922-ucrt-macos-universal.tar.xz
            toolchains/llvm-project
            research/freetype
          key: steamios-sources-xcode27-v2-${{ hashFiles('tools/verify-madeira-pins.py', 'tools/bootstrap/fetch-llvm-mingw.sh', 'tools/runtime-deps/fetch-freetype.sh', 'tools/runtime-deps/fetch-llvm-project.sh') }}

      - name: Install host build prerequisites
        run: brew install bison ccache ninja meson sevenzip

      - name: Verify Xcode 27 and install Metal Toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk" == 27.* ]]
          xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib
          echo "CLEAN_APP_TOOLCHAIN_OK sdk=$sdk"

      - name: Materialize pinned sources and toolchains
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify-madeira-pins.py
          git submodule update --init --recursive --depth 1 FEX
          git submodule update --init --depth 1 wine
          git submodule update --init --depth 1 research/dxmt
          git -C research/dxmt submodule update --init --recursive --depth 1 include/native/directx
          bash tools/bootstrap/fetch-llvm-mingw.sh
          bash tools/runtime-deps/fetch-freetype.sh
          bash tools/runtime-deps/fetch-llvm-project.sh
          bash tools/runtime-deps/fetch-vcruntime.sh
          echo "STEAMOS_IOS_BOOTSTRAP_OK"

      - name: Restore compiled runtime cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            FEX/build-arm64ec
            FEX/build-wow64
            wine/build-macos
            wine/build-i386
            toolchains/gnutls-ios
            build/freetype-ios/build
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: steamios-runtime-xcode27-v4-${{ hashFiles('tools/verify-madeira-pins.py', 'build/fex-arm64ec/build.sh', 'build/fex-wow64/build.sh', 'build/wine-i386/build.sh', 'build/wineserver/**/*.sh', 'build/wine-pe/**/*.sh', 'build/ntdll-unix/**/*.sh', 'build/win32u-unix/**/*.sh', 'build/llvm-ios/build.sh', 'build/gnutls-ios/build.sh', 'build/freetype-ios/build.sh') }}

      - name: Configure persistent compiler cache
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check="$CCACHE_COMPILERCHECK"
          ccache --set-config=base_dir="$CCACHE_BASEDIR"
          ccache --set-config=hash_dir=false
          ccache --zero-stats
          ccache --show-config
          echo "STEAMIOS_CCACHE_READY dir=$CCACHE_DIR"

      - name: Build iOS native dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash build/gnutls-ios/build.sh
          bash build/freetype-ios/build.sh
          echo "STEAMOS_IOS_NATIVE_DEPS_OK"

      - name: Build FEX Windows translators
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          PY_VENV="$PWD/build/steamos-python"
          rm -rf "$PY_VENV"
          python3 -m venv "$PY_VENV"
          "$PY_VENV/bin/python" -m pip install --disable-pip-version-check --quiet 'packaging==24.2'
          export PATH="$PY_VENV/bin:$PATH"
          python3 -c 'from packaging.version import Version; assert Version("24.2") == Version("24.2")'
          bash build/fex-arm64ec/build.sh
          bash build/fex-wow64/build.sh
          echo "STEAMOS_IOS_FEX_TRANSLATORS_OK"

      - name: Configure Wine host headers
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          mkdir -p wine/build-macos
          if [[ ! -f wine/build-macos/config.status ]]; then
            (
              cd wine/build-macos
              ../configure --without-x --disable-tests
            )
          fi
          echo "STEAMOS_IOS_WINE_HOST_CONFIG_OK"

      - name: Build i386 Wine and DXMT Windows farm
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          bash build/wine-i386/build.sh

      - name: Build wineserver and Wine Unix bridges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          bash build/wineserver/bootstrap-base.sh
          bash build/wineserver/build.sh all
          bash build/wine-pe/build-ntdll.sh
          bash build/ntdll-unix/build.sh
          bash build/win32u-unix/build.sh
          echo "STEAMOS_IOS_WINE_UNIX_OK"

      - name: Build LLVM iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          bash build/llvm-ios/build.sh

      - name: Build DXMT iOS renderer and stage licenses
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx --find metal >/dev/null
          xcrun --sdk macosx --find metallib >/dev/null
          bash build/dxmt-ios/build.sh
          bash build/stage-licenses.sh
          echo "STEAMOS_IOS_DXMT_IOS_OK"

      - name: Report persistent cache stats
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true
          du -sh "$CCACHE_DIR" 2>/dev/null || true
          echo "STEAMIOS_CACHE_STATS_REPORTED"

      - name: Link app and package unsigned Debug IPA
        shell: bash
        env:
          STEAMOS_SKIP_NATIVE_REBUILD: "1"
        run: bash build/steamos-ios/build-clean-app.sh

      - name: Verify packaged IPA
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/SteamIOS.ipa
          test -s artifacts/SteamIOS.ipa.sha256
          test -s artifacts/build-info.json
          test -s artifacts/SHA256SUMS
          (cd artifacts && shasum -a 256 -c SHA256SUMS)
          unzip -tq artifacts/SteamIOS.ipa
          unzip -Z1 artifacts/SteamIOS.ipa | grep -q '^Payload/[^/]*\.app/Info.plist$'
          echo "STEAMIOS_IPA_GATE_OK"

      - name: Upload SteamIOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: SteamIOS-Debug-unsigned
          path: |
            artifacts/SteamIOS.ipa
            artifacts/SteamIOS.ipa.sha256
            artifacts/build-info.json
            artifacts/SHA256SUMS
            build/steamos-ios-derived/Build/Products/Debug-iphoneos/SteamIOS.app.dSYM
          if-no-files-found: error
          compression-level: 0

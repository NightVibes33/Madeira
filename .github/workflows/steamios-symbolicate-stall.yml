name: SteamIOS FEX stall symbolication

on:
  push:
    branches: [steamios-fex-lock-diagnosis]
    paths:
      - ".github/workflows/steamios-symbolicate-stall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steamios-fex-symbolicate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnosis-complete:
    runs-on: ubuntu-latest
    steps:
      - run: echo "STEAMIOS_FEX_STALL_DIAGNOSIS_COMPLETE"

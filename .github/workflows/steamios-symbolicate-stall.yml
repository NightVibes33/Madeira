name: SteamIOS FEX stall symbolication

on:
  push:
    branches: [steamios-fex-lock-diagnosis]
    paths:
      - ".github/workflows/steamios-symbolicate-stall.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steamios-fex-symbolicate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symbolicate:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install minimal build prerequisites
        run: brew install bison ninja ccache

      - name: Materialize pinned FEX and ARM64EC toolchain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if git -c http.version=HTTP/1.1 submodule update --init --recursive --depth 1 FEX; then
              break
            fi
            [ "$attempt" -lt 4 ] || exit 1
            sleep $((attempt * 5))
          done
          bash tools/bootstrap/fetch-llvm-mingw.sh
          echo "STEAMIOS_FEX_SYMBOL_SOURCES_READY"

      - name: Build only ARM64EC FEX translator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin:/opt/homebrew/opt/bison/bin:$PATH"
          PY_VENV="$PWD/build/steamos-python-symbol"
          rm -rf "$PY_VENV"
          python3 -m venv "$PY_VENV"
          "$PY_VENV/bin/python" -m pip install --disable-pip-version-check --quiet 'packaging==24.2'
          export PATH="$PY_VENV/bin:$PATH"
          bash build/fex-arm64ec/build.sh
          test -s FEX/build-arm64ec/Bin/libarm64ecfex.dll
          echo "STEAMIOS_FEX_SYMBOL_BUILD_READY"

      - name: Resolve parked wait address
        shell: bash
        run: |
          set -euo pipefail
          dll="$PWD/FEX/build-arm64ec/Bin/libarm64ecfex.dll"
          nm="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin/llvm-nm"
          objdump="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin/llvm-objdump"
          test -s "$dll"
          test -x "$nm"
          test -x "$objdump"
          target=0x1803beba8
          echo "STEAMIOS_FEX_STALL_RVA=0x3beba8"
          echo "STEAMIOS_FEX_STALL_PE_VA=$target"
          "$nm" -n -C --defined-only "$dll" > "$RUNNER_TEMP/fex.nm"
          python3 - "$RUNNER_TEMP/fex.nm" <<'PY'
          import re, sys
          target=0x1803beba8
          rows=[]
          for line in open(sys.argv[1], errors="replace"):
              m=re.match(r"^([0-9A-Fa-f]+)\\s+([A-Za-z?])\\s+(.*)$", line.rstrip())
              if m:
                  rows.append((int(m.group(1),16),m.group(2),m.group(3)))
          rows.sort()
          before=[r for r in rows if r[0] <= target][-32:]
          after=[r for r in rows if r[0] > target][:32]
          print("STEAMIOS_FEX_SYMBOL_WINDOW_BEGIN")
          for addr,typ,name in before+after:
              print(f"{addr:016x} {typ} {name} delta={target-addr:+#x}")
          nearest=max((r for r in rows if r[0] <= target),key=lambda r:r[0],default=None)
          if nearest:
              print(f"STEAMIOS_FEX_STALL_NEAREST addr=0x{nearest[0]:x} delta=0x{target-nearest[0]:x} type={nearest[1]} symbol={nearest[2]}")
          exact=[r for r in rows if r[0] == target]
          for r in exact:
              print(f"STEAMIOS_FEX_STALL_EXACT type={r[1]} symbol={r[2]}")
          print("STEAMIOS_FEX_SYMBOL_WINDOW_END")
          PY
          echo "STEAMIOS_FEX_SECTIONS_BEGIN"
          "$objdump" -h "$dll"
          echo "STEAMIOS_FEX_SECTIONS_END"
          echo "STEAMIOS_FEX_RELOCS_NEAR_BEGIN"
          "$objdump" -r "$dll" | grep -Ei '1803be[0-9a-f]{3}|3be[0-9a-f]{3}' || true
          echo "STEAMIOS_FEX_RELOCS_NEAR_END"

          readobj="$PWD/toolchains/llvm-mingw-20260922-ucrt-macos-universal/bin/llvm-readobj"
          dwarfdump="$(xcrun --find dwarfdump)"
          test -x "$readobj"
          test -x "$dwarfdump"

          echo "STEAMIOS_FEX_SECTION_DETAIL_BEGIN"
          "$readobj" --sections "$dll"
          echo "STEAMIOS_FEX_SECTION_DETAIL_END"

          "$dwarfdump" --debug-info "$dll" > "$RUNNER_TEMP/fex.dwarf"
          python3 - "$RUNNER_TEMP/fex.dwarf" <<'PY'
          import re, sys
          target=0x1803beba8
          lo=target-0x20000
          hi=target+0x20000
          text=open(sys.argv[1],errors="replace").read().splitlines()
          entries=[]
          cur=[]
          for line in text:
              if re.match(r'^0x[0-9a-fA-F]+:\\s+DW_TAG_', line):
                  if cur:
                      entries.append(cur)
                  cur=[line]
              elif cur:
                  cur.append(line)
          if cur:
              entries.append(cur)

          hits=[]
          for block in entries:
              s='\\n'.join(block)
              m=re.search(r'DW_AT_location\\s+\\((?:DW_OP_addr\\s+)?(0x[0-9a-fA-F]+)',s)
              if not m:
                  continue
              addr=int(m.group(1),16)
              if lo <= addr <= hi:
                  name=re.search(r'DW_AT_name\\s+\\("(.*?)"\\)',s)
                  size=re.search(r'DW_AT_byte_size\\s+\\((0x[0-9a-fA-F]+|[0-9]+)\\)',s)
                  tag=re.search(r'DW_TAG_([A-Za-z0-9_]+)',block[0])
                  hits.append((addr, name.group(1) if name else "<?>", size.group(1) if size else "?", tag.group(1) if tag else "?"))
          hits.sort()
          print("STEAMIOS_FEX_DWARF_BSS_WINDOW_BEGIN")
          for addr,name,size,tag in hits:
              print(f"addr=0x{addr:x} delta={target-addr:+#x} tag={tag} size={size} name={name}")
          print("STEAMIOS_FEX_DWARF_BSS_WINDOW_END")

          # Also print raw DWARF context for any line that names an address in
          # the exact 0x1803be000-0x1803c0fff band; this catches expression
          # forms the simple parser above does not recognize.
          pat=re.compile(r'0x1803(?:be|bf|c0)[0-9a-fA-F]{3}',re.I)
          print("STEAMIOS_FEX_DWARF_RAW_NEAR_BEGIN")
          for i,line in enumerate(text):
              if pat.search(line):
                  a=max(0,i-8); b=min(len(text),i+12)
                  print("---")
                  print('\\n'.join(text[a:b]))
          print("STEAMIOS_FEX_DWARF_RAW_NEAR_END")
          PY
          echo "STEAMIOS_FEX_SYMBOLICATION_COMPLETE"

      - name: Upload isolated ARM64EC translator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SteamIOS-FEX-ARM64EC-symbol
          path: FEX/build-arm64ec/Bin/libarm64ecfex.dll
          if-no-files-found: error
          compression-level: 0
